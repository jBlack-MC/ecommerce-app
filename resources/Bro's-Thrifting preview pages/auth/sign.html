<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Account | Your App Name</title>

    <!-- Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --deep-black: #20262D;
            --urban-green: #4B5A4D;
            --cool-sky-blue: #7D8D97;
            --neutral-beige: #D6D1C2;
            --charcoal-gray: #5B5F66;
            --accent: #8A9A8B;
            --light-bg: #F5F3EC;
            --error: #e63946;
            --success: #4BB543;

            /* Primary colors */
            --primary: var(--urban-green);
            --primary-rgb: 75, 90, 77;
            --secondary: var(--cool-sky-blue);
            --secondary-rgb: 125, 141, 151;
            --highlight: var(--accent);
            --highlight-rgb: 138, 154, 139;

            /* UI variables */
            --border-radius: 12px;
            --shadow: 0 4px 20px rgba(0,0,0,0.1);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            --card-bg: rgba(255, 255, 255, 0.96);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: var(--deep-black);
        }

        /* Enhanced Background Animation */
        .bg-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .bg-layer {
            position: absolute;
            width: 200%;
            height: 200%;
            animation: gradientRotate 30s linear infinite;
            opacity: 0.7;
        }

        .layer-1 {
            background: radial-gradient(
                circle at 30% 60%,
                rgba(var(--primary-rgb), 0.8) 0%,
                rgba(var(--secondary-rgb), 0.5) 50%,
                transparent 70%
            );
            top: -50%;
            left: -50%;
            animation-duration: 25s;
            animation-direction: normal;
        }

        .layer-2 {
            background: linear-gradient(
                135deg,
                rgba(var(--highlight-rgb), 0.6) 0%,
                rgba(var(--secondary-rgb), 0.4) 50%,
                rgba(var(--primary-rgb), 0.6) 100%
            );
            top: -100%;
            left: -100%;
            animation-duration: 30s;
            animation-direction: reverse;
        }

        .layer-3 {
            background: conic-gradient(
                from 45deg,
                rgba(var(--primary-rgb), 0.4),
                rgba(var(--highlight-rgb), 0.4),
                rgba(var(--secondary-rgb), 0.4)
            );
            top: -75%;
            left: -75%;
            animation-duration: 20s;
            animation-direction: normal;
            filter: blur(40px);
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            filter: blur(2px);
            animation: float 15s infinite ease-in-out;
            will-change: transform;
        }

        @keyframes gradientRotate {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(10%, 15%); }
            50% { transform: translate(5%, -10%); }
            75% { transform: translate(-5%, 5%); }
        }

        /* Main Container - Enhanced with glass morphism */
        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: var(--border-radius);
            padding: 2.5rem;
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(var(--highlight-rgb), 0.3);
            animation: fadeInUp 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 70%);
            pointer-events: none;
        }

        .container:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(var(--primary-rgb), 0.2);
            border-color: rgba(var(--highlight-rgb), 0.5);
            background: rgba(255, 255, 255, 0.92);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Header - Enhanced with subtle animation */
        .heading {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: var(--primary);
            text-align: center;
            background: linear-gradient(to right, var(--primary), var(--highlight));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
            display: inline-block;
        }

        .heading::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 3px;
            background: linear-gradient(to right, var(--primary), var(--highlight));
            border-radius: 3px;
        }

        .description {
            color: var(--charcoal-gray);
            font-size: 0.95rem;
            text-align: center;
            margin-bottom: 2rem;
            line-height: 1.6;
            max-width: 320px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Enhanced Form Elements */
        .form-group {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .form-group i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--charcoal-gray);
            font-size: 1rem;
            transition: var(--transition);
            z-index: 2;
        }

        .input {
            width: 100%;
            padding: 1rem 1rem 1rem 2.75rem;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: var(--border-radius);
            font-size: 0.95rem;
            transition: var(--transition);
            background-color: rgba(255, 255, 255, 0.8);
            font-family: inherit;
            position: relative;
            z-index: 1;
        }

        .input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(var(--primary-rgb), 0.1);
            background-color: white;
        }

        .input:focus + i {
            color: var(--primary);
            transform: translateY(-50%) scale(1.1);
        }

        /* Enhanced Password Toggle */
        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--charcoal-gray);
            cursor: pointer;
            font-size: 1rem;
            transition: var(--transition);
            z-index: 2;
            background: none;
            border: none;
            padding: 0.5rem;
        }

        .password-toggle:hover {
            color: var(--primary);
            transform: translateY(-50%) scale(1.1);
        }

        /* Enhanced Button with gradient animation */
        .submit-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--highlight) 100%);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1rem;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(var(--primary-rgb), 0.2);
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--highlight) 0%, var(--primary) 100%);
            opacity: 0;
            transition: var(--transition);
            z-index: -1;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(var(--primary-rgb), 0.3);
        }

        .submit-btn:hover::before {
            opacity: 1;
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                to right,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.2) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: rotate(30deg);
            transition: var(--transition);
        }

        .submit-btn:hover::after {
            left: 100%;
        }

        /* Enhanced Divider */
        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            color: var(--charcoal-gray);
            font-size: 0.8rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(0, 0, 0, 0.1), transparent);
            margin: 0 1rem;
        }

        /* Enhanced Social Buttons */
        .social-buttons {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .social-btn {
            width: 3rem;
            height: 3rem;
            border-radius: 50%;
            background: var(--neutral-beige);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        .social-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            transform: scale(0);
            transition: var(--transition);
        }

        .social-btn:hover::before {
            transform: scale(1);
        }

        .social-btn i {
            font-size: 1.2rem;
            color: var(--charcoal-gray);
            transition: var(--transition);
            position: relative;
        }

        .social-btn.google:hover {
            background: #DB4437;
        }
        .social-btn.apple:hover {
            background: #000;
        }
        .social-btn.facebook:hover {
            background: #4267B2;
        }

        .social-btn:hover i {
            color: white;
            transform: scale(1.1);
        }

        /* Enhanced Login Link */
        .login-link {
            text-align: center;
            font-size: 0.95rem;
            color: var(--charcoal-gray);
            margin-top: 1.5rem;
        }

        .login-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s;
            position: relative;
            display: inline-block;
        }

        .login-link a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary);
            transition: width 0.3s;
        }

        .login-link a:hover::after {
            width: 100%;
        }

        /* Enhanced Terms */
        .terms {
            font-size: 0.75rem;
            color: var(--charcoal-gray);
            text-align: center;
            margin-top: 1.5rem;
            line-height: 1.6;
        }

        .terms a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s;
            position: relative;
        }

        .terms a:hover {
            text-decoration: underline;
        }

        /* Enhanced Status Message */
        .status-message {
            padding: 0.75rem;
            border-radius: var(--border-radius);
            margin-bottom: 1rem;
            font-size: 0.9rem;
            text-align: center;
            display: none;
            animation: fadeIn 0.3s ease-out;
            border: 1px solid transparent;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .status-message.success {
            background-color: rgba(75, 181, 67, 0.1);
            color: var(--success);
            display: block;
            border-color: rgba(75, 181, 67, 0.2);
        }

        .status-message.error {
            background-color: rgba(230, 57, 70, 0.1);
            color: var(--error);
            display: block;
            border-color: rgba(230, 57, 70, 0.2);
        }

        /* Enhanced Validation Errors */
        .invalid-feedback {
            color: var(--error);
            font-size: 0.8rem;
            margin-top: 0.25rem;
            display: block;
            animation: shake 0.3s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        .is-invalid {
            border-color: var(--error) !important;
            animation: inputError 0.4s ease-out;
        }

        @keyframes inputError {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-3px); }
            40%, 80% { transform: translateX(3px); }
        }

        .is-invalid + i {
            color: var(--error) !important;
            animation: iconShake 0.4s ease-out;
        }

        @keyframes iconShake {
            0%, 100% { transform: translateY(-50%); }
            20%, 60% { transform: translateY(-50%) translateX(-3px); }
            40%, 80% { transform: translateY(-50%) translateX(3px); }
        }

        /* Enhanced Loading Spinner */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-left: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Password Strength Meter */
        .password-strength {
            height: 4px;
            background: #eee;
            border-radius: 2px;
            margin-top: 0.5rem;
            overflow: hidden;
            position: relative;
        }

        .password-strength::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0;
            background: var(--error);
            transition: width 0.3s ease;
        }

        .password-strength.weak::before {
            width: 30%;
            background: var(--error);
        }

        .password-strength.medium::before {
            width: 60%;
            background: #ffa500;
        }

        .password-strength.strong::before {
            width: 100%;
            background: var(--success);
        }

        /* Responsive Enhancements */
        @media (max-width: 768px) {
            .container {
                padding: 2rem;
            }

            .heading::after {
                width: 40px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 1rem;
            }

            .heading {
                font-size: 1.75rem;
            }

            .container {
                padding: 1.5rem;
            }

            .social-buttons {
                gap: 0.75rem;
            }

            .social-btn {
                width: 2.75rem;
                height: 2.75rem;
            }
        }
    </style>
</head>
<body>
    <!-- Enhanced Background Animation -->
    <div class="bg-animation">
        <div class="bg-layer layer-1"></div>
        <div class="bg-layer layer-2"></div>
        <div class="bg-layer layer-3"></div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <h1 class="heading">Create Your Account</h1>
        <p class="description">Join our community and get started today</p>

        <!-- Status message -->
        <div class="status-message success" id="successMessage" style="display: none;"></div>
        <div class="status-message error" id="errorMessage" style="display: none;"></div>

        <form method="POST" action="#" id="signupForm">
            <div class="form-group">
                <input type="text" class="input"
                       id="name" name="name"
                       placeholder="Full Name" required autofocus />
                <i class="fas fa-user"></i>
                <span class="invalid-feedback" id="nameError"></span>
            </div>

            <div class="form-group">
                <input type="email" class="input"
                       id="email" name="email"
                       placeholder="Email Address" required />
                <i class="fas fa-envelope"></i>
                <span class="invalid-feedback" id="emailError"></span>
            </div>

            <div class="form-group">
                <input type="password" class="input"
                       id="password" name="password" placeholder="Password" required />
                <i class="fas fa-lock"></i>
                <button type="button" class="password-toggle" id="togglePassword">
                    <i class="fas fa-eye"></i>
                </button>
                <span class="invalid-feedback" id="passwordError"></span>
                <div class="password-strength" id="passwordStrength"></div>
            </div>

            <div class="form-group">
                <input type="password" class="input" id="password-confirm"
                       name="password_confirmation" placeholder="Confirm Password" required />
                <i class="fas fa-lock"></i>
                <span class="invalid-feedback" id="confirmPasswordError"></span>
            </div>

            <button type="submit" class="submit-btn" id="submitButton">
                <span>Create Account</span>
                <div class="spinner" id="spinner"></div>
            </button>
        </form>

        <!-- Divider -->
        <div class="divider">or sign up with</div>

        <!-- Social Login Buttons -->
        <div class="social-buttons">
            <button type="button" class="social-btn google" aria-label="Sign up with Google">
                <i class="fab fa-google"></i>
            </button>
            <button type="button" class="social-btn apple" aria-label="Sign up with Apple">
                <i class="fab fa-apple"></i>
            </button>
            <button type="button" class="social-btn facebook" aria-label="Sign up with Facebook">
                <i class="fab fa-facebook-f"></i>
            </button>
        </div>

        <!-- Login Link -->
        <p class="login-link">Already have an account? <a href="#">Sign in</a></p>

        <!-- Terms and Conditions -->
        <p class="terms">By creating an account, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            const confirmPasswordInput = document.getElementById('password-confirm');
            const form = document.getElementById('signupForm');
            const submitBtn = document.getElementById('submitButton');
            const spinner = document.getElementById('spinner');
            const bgAnimation = document.querySelector('.bg-animation');
            const successMessage = document.getElementById('successMessage');
            const errorMessage = document.getElementById('errorMessage');
            const passwordStrength = document.getElementById('passwordStrength');

            // Create floating particles
            function createParticles() {
                for (let i = 0; i < 20; i++) {
                    const particle = document.createElement('div');
                    particle.classList.add('particle');

                    // Random properties
                    const size = Math.random() * 6 + 2;
                    const posX = Math.random() * 100;
                    const posY = Math.random() * 100;
                    const delay = Math.random() * 20;
                    const duration = Math.random() * 15 + 10;
                    const opacity = Math.random() * 0.6 + 0.2;

                    particle.style.width = `${size}px`;
                    particle.style.height = `${size}px`;
                    particle.style.left = `${posX}%`;
                    particle.style.top = `${posY}%`;
                    particle.style.animationDelay = `${delay}s`;
                    particle.style.animationDuration = `${duration}s`;
                    particle.style.opacity = opacity;

                    bgAnimation.appendChild(particle);
                }
            }

            // Check password strength
            function checkPasswordStrength(password) {
                // Reset
                passwordStrength.className = 'password-strength';

                if (!password) return;

                // Check strength
                let strength = 0;

                // Length
                if (password.length > 7) strength++;
                if (password.length > 11) strength++;

                // Contains numbers
                if (/\d/.test(password)) strength++;

                // Contains special chars
                if (/[!@#$%^&*(),.?":{}|<>]/.test(password)) strength++;

                // Contains both lower and upper case
                if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;

                // Visual feedback
                if (strength < 2) {
                    passwordStrength.classList.add('weak');
                } else if (strength < 4) {
                    passwordStrength.classList.add('medium');
                } else {
                    passwordStrength.classList.add('strong');
                }
            }

            // Validate form fields
            function validateForm() {
                let isValid = true;

                // Validate name
                const name = form.name.value.trim();
                if (name.length < 2) {
                    document.getElementById('nameError').textContent = 'Please enter a valid name';
                    form.name.classList.add('is-invalid');
                    isValid = false;
                }

                // Validate email
                const email = form.email.value.trim();
                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                    document.getElementById('emailError').textContent = 'Please enter a valid email';
                    form.email.classList.add('is-invalid');
                    isValid = false;
                }

                // Validate password
                const password = form.password.value;
                if (password.length < 8) {
                    document.getElementById('passwordError').textContent = 'Password must be at least 8 characters';
                    form.password.classList.add('is-invalid');
                    isValid = false;
                }

                // Validate password confirmation
                if (password !== confirmPasswordInput.value) {
                    document.getElementById('confirmPasswordError').textContent = 'Passwords do not match';
                    confirmPasswordInput.classList.add('is-invalid');
                    isValid = false;
                }

                return isValid;
            }

            // Initialize
            createParticles();

            // Toggle password visibility
            if (togglePassword) {
                togglePassword.addEventListener('click', function() {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    this.querySelector('i').classList.toggle('fa-eye');
                    this.querySelector('i').classList.toggle('fa-eye-slash');
                });
            }

            // Password strength check
            passwordInput.addEventListener('input', function() {
                checkPasswordStrength(this.value);
            });

            // Form submission
            form.addEventListener('submit', function(e) {
                e.preventDefault();

                // Reset error states
                document.querySelectorAll('.is-invalid').forEach(el => el.classList.remove('is-invalid'));
                document.querySelectorAll('.invalid-feedback').forEach(el => el.textContent = '');

                // Validate form
                if (!validateForm()) {
                    return;
                }

                // Show loading state
                submitBtn.disabled = true;
                spinner.style.display = 'inline-block';
                submitBtn.querySelector('span').textContent = 'Creating Account...';

                // Simulate form submission
                setTimeout(() => {
                    // This is where you would normally make an AJAX call to your backend
                    console.log('Form submitted', {
                        name: form.name.value,
                        email: form.email.value,
                        password: form.password.value
                    });

                    // For demo purposes, show success message
                    successMessage.style.display = 'block';
                    successMessage.textContent = 'Account created successfully!';
                    errorMessage.style.display = 'none';

                    // Reset form
                    submitBtn.disabled = false;
                    spinner.style.display = 'none';
                    submitBtn.querySelector('span').textContent = 'Create Account';

                    // Clear form after successful submission
                    form.reset();
                    passwordStrength.className = 'password-strength';
                }, 1500);
            });

            // Social button click handlers
            document.querySelectorAll('.social-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const service = this.classList.contains('google') ? 'Google' :
                                 this.classList.contains('apple') ? 'Apple' : 'Facebook';

                    // Show loading state
                    const icon = this.querySelector('i');
                    const originalIcon = icon.className;
                    icon.className = 'fas fa-spinner fa-spin';

                    // Simulate social login
                    setTimeout(() => {
                        icon.className = originalIcon;
                        alert(`Would normally authenticate with ${service}`);
                    }, 1000);
                });
            });
        });
    </script>
</body>
</html>
